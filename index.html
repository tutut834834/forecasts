<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Day Forecast Study</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="./config.js"></script>
<style>
body{margin:0;background:#07101d;color:#eef5ff;font-family:system-ui,Segoe UI,Arial}.wrap{max-width:1000px;margin:auto;padding:24px 14px 70px}
p{color:#9fb0c8;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stock{margin:30px 0 42px}
.card,.finish{background:#0e1b2b;border:1px solid #203854;border-radius:18px;padding:14px}.chartwrap{height:250px;touch-action:none}
.result{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}.value{color:#6ee7b7;font-weight:800}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.secondary{background:#142942;color:#fff;border:1px solid #33516f}
.progress{height:8px;background:#14243a;border-radius:999px;overflow:hidden}#bar{height:100%;background:#7ab0ff;width:0}
.status{margin-top:12px;white-space:pre-wrap;color:#9fb0c8}.ok{color:#6ee7b7;font-weight:800}.warn{color:#ffcf70;font-weight:800}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>One-Day Forecast Study</h1>
<p>Forecast the <b>next trading-day close</b>. Touch or click the shaded area on the right. Each anonymous stock appears with the last <b>5</b>, <b>10</b>, and <b>20</b> closes.</p>
<p><b>Historical cutoff:</b> 31 Aug 2026.</p>
<div class="progress"><div id="bar"></div></div><p id="prog">0 / 6 forecasts</p>
<div id="app"></div>
<section class="finish"><h2>Finish</h2><p>Place all 6 forecast points, then submit once.</p>
<button onclick="submitAll()" id="submitBtn">Submit forecasts</button>
<button class="secondary" onclick="resetAll()">Reset</button>
<div id="status" class="status"></div></section>
</div>
<script>
const WORKER=(window.APP_CONFIG?.WORKER_URL||"").replace(/\/$/,"");
const stocks=[{"id": "s1", "label": "Stock 1", "data": [{"date": "2026-08-04", "close": 146.35}, {"date": "2026-08-05", "close": 145.0}, {"date": "2026-08-06", "close": 145.15}, {"date": "2026-08-07", "close": 143.65}, {"date": "2026-08-10", "close": 143.5}, {"date": "2026-08-11", "close": 140.0}, {"date": "2026-08-12", "close": 140.0}, {"date": "2026-08-13", "close": 139.5}, {"date": "2026-08-14", "close": 136.3}, {"date": "2026-08-17", "close": 136.4}, {"date": "2026-08-18", "close": 136.75}, {"date": "2026-08-19", "close": 138.35}, {"date": "2026-08-20", "close": 138.05}, {"date": "2026-08-21", "close": 137.95}, {"date": "2026-08-24", "close": 138.4}, {"date": "2026-08-25", "close": 139.35}, {"date": "2026-08-26", "close": 138.65}, {"date": "2026-08-27", "close": 140.1}, {"date": "2026-08-28", "close": 140.25}, {"date": "2026-08-31", "close": 139.0}]}, {"id": "s2", "label": "Stock 2", "data": [{"date": "2026-08-04", "close": 90.96}, {"date": "2026-08-05", "close": 91.46}, {"date": "2026-08-06", "close": 91.82}, {"date": "2026-08-07", "close": 91.92}, {"date": "2026-08-10", "close": 91.68}, {"date": "2026-08-11", "close": 90.9}, {"date": "2026-08-12", "close": 89.66}, {"date": "2026-08-13", "close": 89.32}, {"date": "2026-08-14", "close": 89.04}, {"date": "2026-08-17", "close": 87.34}, {"date": "2026-08-18", "close": 86.2}, {"date": "2026-08-19", "close": 87.56}, {"date": "2026-08-20", "close": 89.22}, {"date": "2026-08-21", "close": 90.0}, {"date": "2026-08-24", "close": 91.42}, {"date": "2026-08-25", "close": 91.96}, {"date": "2026-08-26", "close": 92.74}, {"date": "2026-08-27", "close": 91.86}, {"date": "2026-08-28", "close": 92.9}, {"date": "2026-08-31", "close": 92.2}]}], WINDOWS=[5,10,20], KEY="forecast-v7";
const state=JSON.parse(localStorage.getItem(KEY)||"{}"), charts={};
const shade={id:"shade",beforeDraw(c){const a=c.chartArea;if(!a)return;const x=c.scales.x,ctx=c.ctx,b=x.getPixelForValue(c.data.labels.length-2+.35);ctx.save();ctx.fillStyle="rgba(110,231,183,.09)";ctx.fillRect(b,a.top,a.right-b,a.bottom-a.top);ctx.strokeStyle="rgba(110,231,183,.8)";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(b,a.top);ctx.lineTo(b,a.bottom);ctx.stroke();ctx.restore()}};
function fmt(v){return "€"+Number(v).toFixed(2)} function save(){localStorage.setItem(KEY,JSON.stringify(state));progress()}
function progress(){let n=0;for(const s of stocks)for(const w of WINDOWS)if(state[`${s.id}-${w}`]!=null)n++;document.getElementById("prog").textContent=`${n} / 6 forecasts`;document.getElementById("bar").style.width=(n/6*100)+"%"}
function chart(s,w,id){const h=s.data.slice(-w),labels=h.map(x=>x.date.slice(5).replace("-","/"));labels.push("NEXT");const a=h.map(x=>x.close);a.push(null);const f=new Array(labels.length).fill(null);if(state[id]!=null)f.at(-1);f[labels.length-1]=state[id]??null;const vals=h.map(x=>x.close),lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(hi-lo,hi*.025),pad=span*.65;
const c=new Chart(document.getElementById("c-"+id),{type:"line",plugins:[shade],data:{labels,datasets:[{data:a,borderColor:"#7ab0ff",borderWidth:2.5,pointRadius:3,tension:.18},{data:f,borderColor:"#6ee7b7",backgroundColor:"#6ee7b7",pointRadius:9,showLine:false}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#9fb0c8"}},y:{min:lo-pad,max:hi+pad,ticks:{color:"#9fb0c8",callback:v=>"€"+Number(v).toFixed(2)}}}}});charts[id]=c;const el=c.canvas;
function choose(cx,cy){const r=el.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,b=c.scales.x.getPixelForValue(c.data.labels.length-2+.25);if(x<b)return;let p=c.scales.y.getValueForPixel(y);if(!Number.isFinite(p))return;p=Math.round(p*100)/100;state[id]=p;save();c.data.datasets[1].data[c.data.labels.length-1]=p;c.update();document.getElementById("v-"+id).innerHTML=`<span class="value">Forecast: ${fmt(p)}</span>`}
el.addEventListener("click",e=>choose(e.clientX,e.clientY));el.addEventListener("touchend",e=>{if(e.changedTouches[0]){e.preventDefault();choose(e.changedTouches[0].clientX,e.changedTouches[0].clientY)}},{passive:false});if(state[id]!=null)document.getElementById("v-"+id).innerHTML=`<span class="value">Forecast: ${fmt(state[id])}</span>`}
function build(){const app=document.getElementById("app");stocks.forEach((s,i)=>{const sec=document.createElement("section");sec.className="stock";sec.innerHTML=`<h2>Stock ${i+1}</h2><div class="grid" id="g-${s.id}"></div>`;app.appendChild(sec);const g=sec.querySelector(".grid");for(const w of WINDOWS){const id=`${s.id}-${w}`,d=document.createElement("div");d.className="card";d.innerHTML=`<h3>Last ${w} trading days</h3><p>Tap shaded forecast zone →</p><div class="chartwrap"><canvas id="c-${id}"></canvas></div><div class="result"><span id="v-${id}">No point selected</span><button class="secondary" onclick="clearPoint('${id}')">Clear</button></div>`;g.appendChild(d);chart(s,w,id)}});progress()}
function clearPoint(id){delete state[id];save();const c=charts[id];c.data.datasets[1].data[c.data.labels.length-1]=null;c.update();document.getElementById("v-"+id).textContent="No point selected"}
function resetAll(){if(confirm("Reset all forecasts?")){localStorage.removeItem(KEY);location.reload()}}
function collect(){const f=[];for(const s of stocks)for(const w of WINDOWS){const id=`${s.id}-${w}`;if(state[id]==null)return null;f.push({stock_id:s.id,history_window_days:w,forecast_next_close:state[id],last_known_date:s.data.at(-1).date,last_known_close:s.data.at(-1).close})}return f}
async function submitAll(){const st=document.getElementById("status"),f=collect();if(!f){st.textContent="Complete all 6 forecasts first.";return}if(!WORKER||WORKER.includes("REPLACE-THIS-ONCE")){st.innerHTML='<span class="warn">Admin has not connected the submission service yet.</span>';return};document.getElementById("submitBtn").disabled=true;st.textContent="Submitting…";try{const r=await fetch(WORKER+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({anonymous_id:crypto.randomUUID(),submitted_at:new Date().toISOString(),cutoff_date:"2026-08-31",forecasts:f})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Upload failed");st.innerHTML=`<span class="ok">✓ Saved successfully.</span>\n${j.path}`}catch(e){st.textContent="Submission failed: "+e.message;document.getElementById("submitBtn").disabled=false}}
build();
</script></body></html>
